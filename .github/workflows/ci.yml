Synthetic data rules
• Positions follow actual highway geometry; speeds vary between 70 and 110 km/h with slower urban and fuel-stop segments.
• Temperature is generated from a simple thermal model: set point, ambient swing across the day (up to 45 °C in summer), door-open heat gain, and optional reefer fault injection, plus sensor noise of about ±0.2 °C.
• All company names, truck plates and driver names are invented. No real customer data is used.
• Seed values are stored in JSON so the data can be regenerated and changed without touching code.
Technical notes for the demo build
• Single-page web app, client-side simulation engine, no backend needed, so it can be hosted anywhere and works offline at a customer meeting.
• Map via an open-source library (Leaflet or MapLibre); charts via Chart.js or similar; Arabic right-to-left layout from day one.
• The ML health score in the demo uses the same formula as Appendix C (cumulative exposure model) so the numbers shown are explainable, not scripted.
