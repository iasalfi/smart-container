12. Implementation approach
The recommended route is a pilot of 10 containers for 60 days, mixing dry and reefer boxes, before any fleet-wide commitment. The pilot KPIs in section 15 decide whether Gate 2 is passed.
Gate 1 confirms that devices fit, read and report on the actual container types, including reefers. Gate 2 confirms that the pilot KPIs are met, and it is the point at which the customer issues a rollout order.
Pilot deliverables
• Platform configured with the customer's cargo profiles, thresholds, users and alert rules, in Arabic and English.
• Devices fitted to the pilot containers, either supplied by the supplier (with a 1-year warranty) or sourced by the customer to the published specification.
• User training for operators, quality and security staff.
• Weekly review of alerts, route stops and cargo health scores with the customer.
• A pilot report with KPI results, excursion analysis and a rollout recommendation.
