Appendix C. Cargo health model (baseline for demo and pilot)
The first release uses an explainable exposure model that can be reproduced in the demo, with a trained model added as data from live trips builds up. Excursion exposure is accumulated as degree-hours outside the band, and spoilage rate rises with temperature in a Q10-style curve (Q10 assumed between 2 and 3, to be tuned per cargo class).
D_T = \sum_i \max(0,\; T_i - T_{max},\; T_{min} - T_i)\,\Delta t_i
H = 100\,\exp\!\big(-(a_c D_T + b_c D_H + g_c D_G)\big), \qquad r(T) = Q_{10}^{(T - T_{ref})/10}
Here D_H and D_G are the same sum for humidity and gas, a, b and g are weights per cargo class, and r(T) is the relative spoilage rate used to reduce the remaining shelf-life estimate. The early-warning rule projects the next 2 to 6 hours from the recent slope (a rolling linear or exponential-smoothing forecast) and fires when the projected value crosses the band. A gradient-boosted model or LSTM trained on labelled trip outcomes (accepted, partially rejected, rejected) can replace the weights once the pilot provides enough data; the explainable factors stay in place.
