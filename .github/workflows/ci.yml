2. Executive summary and business context
Shippers and carriers in Saudi Arabia move high-value and perishable cargo over long road distances, often 800 to 1,500 km between Jeddah, Riyadh, Dammam and the northern and southern borders, in summer ambient temperatures above 45 °C. Today most operators know where the truck is, but not what is happening inside the container: whether the reefer held its set point, whether humidity spoiled dry goods, whether the doors were opened at a roadside stop, or whether the load is off-gassing.
The proposed solution puts a sensor and tracking unit inside each container and a cloud platform behind it. It reports position, temperature, humidity and door state in near real time, flags deviations from the planned route, and scores the likely health of the cargo using machine-learning logic on the temperature and humidity history. Gas sensing for ammonia (NH3) and hydrogen sulphide (H2S) and a smart padlock are offered as options for spoilage-prone and high-security loads.
What the customer gets:
• Fewer rejected consignments, because excursions are caught while the truck can still be rerouted or the reefer serviced.
• Evidence for claims and disputes: a time-stamped, tamper-evident record of conditions and door events from loading to delivery.
• Lower theft and pilferage exposure, through door-open alerts and unscheduled-stop detection.
• One screen for operations, with fleet, route and cargo condition together.
Assumed customer segments: food and pharma cold chain, FMCG and retail distribution, port-to-warehouse container haulage, and fresh produce and meat importers. The segment list should be confirmed against the target account before the deck is finalised.
3. Objectives and scope
The solution has to make every road-moving container in the customer's fleet visible and accountable from gate-out to delivery.
Objectives
1. Give operations a live position and condition view of 100% of equipped containers, with data no older than 60 seconds while moving.
2. Detect temperature, humidity, door and (optionally) gas excursions and alert the right person within 2 minutes of the event.
3. Show planned versus actual route, and classify every stop as scheduled or unscheduled.
4. Estimate remaining cargo shelf-life and spoilage risk from the sensor history.
5. Produce a delivery-time condition report that can be attached to a claim, a customs query or a customer SLA review.
