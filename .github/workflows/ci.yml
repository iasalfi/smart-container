name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static-checks:
    name: Lint, types, test bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test bank consistency (every case automated, tags correct)
        run: npm run test:bank

  unit-and-api:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - run: npm run test:unit

  api-container:
    name: API container image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t scm-api .
      - name: Start and probe
        run: |
          docker run -d --name scm-api -p 4100:4100 scm-api
          for i in $(seq 1 20); do curl -fs localhost:4100/api/v1/health && break || sleep 1; done
          curl -fs localhost:4100/api/v1/fleet?limit=1 | grep -q '"total":1000'
      - if: always()
        run: docker logs scm-api || true

  e2e:
    name: E2E (features, UI, UX, accessibility, service boundary)
    runs-on: ubuntu-latest
    needs: [static-checks, unit-and-api]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run vendor
      - name: Build the web UI against the local API (port 4100)
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
      - name: Regression, progression, negative, UI, UX, a11y and service-boundary suites
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  release-gate:
    name: release-gate
    # Vercel holds each production deployment until this check is green.
    # It fails unless every test job passed, so a skipped or cancelled job can never release.
    runs-on: ubuntu-latest
    if: always()
    needs: [static-checks, unit-and-api, api-container, e2e]
    steps:
      - name: Require every test job to pass
        run: |
          echo "static-checks: ${{ needs.static-checks.result }}"
          echo "unit-and-api:  ${{ needs.unit-and-api.result }}"
          echo "api-container: ${{ needs.api-container.result }}"
          echo "e2e:           ${{ needs.e2e.result }}"
          test "${{ needs.static-checks.result }}" = "success"
          test "${{ needs.unit-and-api.result }}" = "success"
          test "${{ needs.api-container.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
