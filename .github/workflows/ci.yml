8. Solution architecture
The solution has four layers: an in-container device, the mobile network, a cloud platform hosted in the Kingdom, and the apps and systems that use the data.
Readings and door events travel left to right; lock and unlock commands for the optional padlock travel back the other way through the same channel. The cargo health model is highlighted because it is the layer that turns raw readings into a decision.
Layer
Design choices to confirm in the technical proposal
Device
One sealed unit mounted inside the container with an external antenna path; temperature, humidity and door sensing as standard, gas and padlock as add-on modules
Network
Cellular with a multi-network SIM for coverage along desert corridors; device buffers up to 7 days of readings when out of coverage
Cloud
Hosted in a Saudi data centre region; services split into ingestion, storage, rules, route engine, ML and API so each can scale separately
Applications
Responsive web app in Arabic and English; alerts by SMS, e-mail and push; PDF delivery reports
Integration
REST API and webhooks; connectors and single sign-on for the customer's TMS, ERP and portals
