Assumptions
• Sensors and devices are either supplied by the supplier from certified partners, or sourced by the customer to the published specification; the supplier does not manufacture them.
• Containers are standard 20 ft or 40 ft dry or reefer boxes; non-standard cargo bodies need a separate fit check.
• The customer provides route and stop data per trip, or the platform learns approved stops from the first trips.
• The demo uses synthetic data and is not evidence of live performance. All regulatory compliance for hardware import, and the legality of the hardware in KSA, is managed and handled by the customer, whichever party supplies the hardware.
